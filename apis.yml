aid: airislabsb51a
name: Airis Labs
description: Airis Labs (AI RIS Labs Ltd.) is a defense and public-safety AI company, founded in 2023 and based
  in Washington, D.C. and Tel Aviv, whose User-Generated Field Intelligence (UGFI) platform turns unstructured user-generated
  video and other visual sources - smartphones, social media, digital forensics, CCTV, body cams, drones and FMV
  - into structured, searchable intelligence for government, homeland security, law enforcement and military analysts,
  with agentic analyst workflows and self-hosted or sovereign-cloud deployment. The company markets a demo-led,
  customer-controlled product and publishes no public API, SDK, developer portal or machine-readable contract.
